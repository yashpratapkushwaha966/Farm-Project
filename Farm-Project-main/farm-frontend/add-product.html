<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Product</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e8f5e9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      background: white;
      padding: 30px;
      width: 420px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      color: #1b5e20;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2e7d32;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Add Product</h2>

    <form id="productForm">
      <input type="text" id="farmerName" placeholder="Farmer Name" required />
      <input type="text" id="productName" placeholder="Product Name" required />
      <input type="text" id="category" placeholder="Category" required />
      <input type="number" id="price" placeholder="Price" required />
      <input type="text" id="quantity" placeholder="Quantity" required />
      <input type="text" id="location" placeholder="Location" required />
      <input type="text" id="imageUrl" placeholder="Image URL" required />

      <button type="submit">Add Product</button>

      <p id="message"></p>
    </form>
  </div>

  <script>
    const API_URL = "https://farm-project-7ii2.onrender.com";

    const productForm = document.getElementById("productForm");
    const message = document.getElementById("message");

    productForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const productData = {
        farmerName: document.getElementById("farmerName").value,
        productName: document.getElementById("productName").value,
        category: document.getElementById("category").value,
        price: Number(document.getElementById("price").value),
        quantity: document.getElementById("quantity").value,
        location: document.getElementById("location").value,
        imageUrl: document.getElementById("imageUrl").value,
      };

      try {
        const res = await fetch(`${API_URL}/api/products`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(productData),
        });

        const data = await res.json();

        if (res.ok) {
          message.style.color = "green";
          message.innerText = data.message;
          productForm.reset();
        } else {
          message.style.color = "red";
          message.innerText = data.message;
        }
      } catch (error) {
        message.style.color = "red";
        message.innerText = "Server not connected";
      }
    });
  </script>
</body>
</html>
