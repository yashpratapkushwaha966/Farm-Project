<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FarmConnect Cart</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(120deg, #eaffea, #fff7d6);
      color: #1f3d1f;
    }

    header {
      padding: 22px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      color: #1f8f3a;
    }

    .home-btn {
      text-decoration: none;
      background: #1f8f3a;
      color: white;
      padding: 12px 25px;
      border-radius: 25px;
      font-weight: bold;
    }

    .cart-section {
      padding: 70px 8%;
    }

    .cart-box {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.1);
      animation: fadeUp 1s ease;
    }

    .cart-header {
      display: grid;
      grid-template-columns: 120px 1fr 120px 120px;
      gap: 20px;
      font-weight: bold;
      padding-bottom: 15px;
      border-bottom: 2px solid #e5f5e5;
      color: #1f8f3a;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 120px 1fr 120px 120px;
      gap: 20px;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid #e5f5e5;
    }

    .cart-item img {
      width: 100px;
      height: 80px;
      object-fit: cover;
      border-radius: 15px;
    }

    .cart-item h3 {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .cart-item p {
      color: #526652;
    }

    .price {
      font-weight: bold;
      color: #1f8f3a;
      font-size: 18px;
    }

    .remove-btn {
      border: none;
      background: #ffdddd;
      color: #b30000;
      padding: 10px 14px;
      border-radius: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .summary {
      margin-top: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f0fff0;
      padding: 25px;
      border-radius: 22px;
    }

    .summary h2 {
      color: #1f8f3a;
    }

    .checkout-btn {
      border: none;
      background: #1f8f3a;
      color: white;
      padding: 14px 30px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .checkout-btn:hover,
    .home-btn:hover {
      background: #156b2a;
    }

    .empty {
      text-align: center;
      padding: 50px;
      font-size: 24px;
      color: #526652;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media(max-width: 768px) {
      .cart-header {
        display: none;
      }

      .cart-item {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .cart-item img {
        margin: auto;
      }

      .summary {
        flex-direction: column;
        gap: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">FarmConnect Cart</div>
    <a href="index.html" class="home-btn">Back To Home</a>
  </header>

  <section class="cart-section">
    <div class="cart-box">

      <div class="cart-header">
        <span>Image</span>
        <span>Product</span>
        <span>Price</span>
        <span>Action</span>
      </div>

      <div id="cartItems"></div>

      <div class="summary">
        <h2>Total: ₹<span id="cartTotal">0</span></h2>
        <button class="checkout-btn" onclick="checkout()">Checkout</button>
      </div>

    </div>
  </section>

  <script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function showCart() {
      const cartItems = document.getElementById("cartItems");
      const cartTotal = document.getElementById("cartTotal");

      cartItems.innerHTML = "";

      let total = 0;

      if (cart.length === 0) {
        cartItems.innerHTML = `<div class="empty">Your cart is empty 🛒</div>`;
      }

      cart.forEach((item, index) => {
        total += item.price;

        cartItems.innerHTML += `
          <div class="cart-item">
            <img src="${item.image}" alt="${item.name}">
            <div>
              <h3>${item.name}</h3>
              <p>Fresh farm product</p>
            </div>
            <div class="price">₹${item.price}</div>
            <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
          </div>
        `;
      });

      cartTotal.innerText = total;
    }

    function removeItem(index) {
      cart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      showCart();
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Your cart is empty");
        return;
      }

      alert("Order placed successfully!");
      localStorage.removeItem("cart");
      cart = [];
      showCart();
    }

    showCart();
  </script>

</body>
</html>
